name: Update MojeKino Catalog

on:
  schedule:
    # Run every night at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual triggering from GitHub Actions UI

permissions:
  contents: write

jobs:
  build-and-update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r indexer/requirements.txt

      - name: Run Catalog Indexer
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python indexer/build_catalog.py

      - name: Commit and push catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Auto-update catalog.json [skip ci]" || echo "No changes to commit"
          
          # TENTO ŘÁDEK STÁHNE AKTUÁLNÍ ZMĚNY NEŽ TO POŠLE VEN:
          git pull --rebase origin main
          
          git push origin main
